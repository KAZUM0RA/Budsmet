# Конфіг nginx для Budsmet.
# Встановлюється скриптом setup.sh; certbot згодом додає сюди блок HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Відомості обсягів робіт бувають об'ємними (ліміт застосунку — 20 МБ).
    client_max_body_size 25m;

    # Кошториси нікого стороннього не стосуються: вхід за логіном і паролем.
    auth_basic "Budsmet";
    auth_basic_user_file /etc/nginx/budsmet.htpasswd;

    access_log /var/log/nginx/budsmet.access.log;
    error_log  /var/log/nginx/budsmet.error.log;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Розбір великої відомості та підбір цін можуть тривати десятки секунд.
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }
}
